<body>

    <h1><a href="https://www.nytimes.com">New York Times</a></h1>
    
    <div id="map"></div>

    <script>

        var map = L.map('map').setView([33.7175, -79.05004], 17); // Centered on Myrtle Beach, SC
                // L.map('map').setView([40.7484, -73.9857], 17) // Centered on Times Square, New York

        // Add OpenStreetMap or other tile layer fo base map
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        var data = {
            "type": "FeatureCollection",
            "features": [
                {
                    "type": "Feature",
                    "geometry": {
                        "type": "Point",
                        "coordinates": [-73.9857, 40.7484] // Longitude, Latitude
                    },
                    "properties": {
                        "name": "Times Square",
                        "city": "New York",
                        "country": "USA"
                }
                },
                {
                    "type": "Feature",
                    "geometry": {
                        "type": "Point",
                        "coordinates": [2.2945, 48.8584] // Longitude, Latitude
                    },
                    "properties": {
                        "name": "Eiffel Tower",
                        "city": "Paris",
                        "country": "France"
                }
                }
            ]
        }

        // Add GeoJSON layer to the map, onEachFeature to bind popups with name, city, and country
        // The onEachFeature function is called for each feature in the GeoJSON data, allowing us to bind a popup to each marker with the desired information.
        L.geoJSON(data, {
            onEachFeature: function (feature, layer) {
                var name = feature.properties.name;
                var city = feature.properties.city;
                var country = feature.properties.country;

                var popupContent = "<strong>" + name + "</strong><br>" +
                                   city + ", " + country;

                layer.bindPopup(popupContent);
            }
        }).addTo(map);

        // Add a marker for just the Eiffel Tower with a popup
        // This is an additional marker that specifically highlights the Eiffel Tower, demonstrating how to add a marker with a popup directly without using GeoJSON.
        L.marker([48.8584, 2.2945]).addTo(map)

        // Create a variable that has the value of the property  city of the first feature in data
        var myCity = data.features[0].properies.city

        // Create a variable that is the longitude of New York using JS dot nota on to get the value from variable data
        var myLon = data.features[0].geometry.coordinates[0]

        //  Create a variable that is an array that has the latitude and longitude for NYC using the variable data and the JS dot notaion
        var myCoord = [
            data.features[0].geometry.coordinates[1], // Latitude
            data.features[0].geometry.coordinates[0]  // Longitude
        ]

        //  Create a variable that contains an array of the features in variable data
        var myFeatures = data.features;

    </script>
</body>
