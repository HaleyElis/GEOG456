<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HW4 – Earthquakes</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- REQUIRED: loads GeoJSON as variable named `data` -->
  <script src="data.js"></script>

  <style>
    #map {
      height: 600px;
    }
  </style>
</head>

<body>
  <h1>USGS Earthquakes</h1>
  <div id="map"></div>

  <h2>Earthquake Table (sample)</h2>
<table id="eqTable" border="1" cellpadding="6" style="border-collapse:collapse; width:100%;">
  <thead>
    <tr>
      <th>Time</th>
      <th>Magnitude</th>
      <th>Place</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>


  <script>
  // Create map
  var map = L.map("map").setView([20, 0], 2);

  // Basemap
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  function getColor(mag) {
    // magnitude color ramp (small -> large)
    return mag >= 7 ? "#800026" :
           mag >= 6 ? "#BD0026" :
           mag >= 5 ? "#E31A1C" :
           mag >= 4 ? "#FC4E2A" :
           mag >= 3 ? "#FD8D3C" :
           mag >= 2 ? "#FEB24C" :
           mag >= 1 ? "#FED976" :
                      "#FFEDA0";
  }

  function getRadius(mag) {
    if (mag == null || isNaN(mag)) return 3;
    return Math.max(3, Math.min(20, mag * 3));
  }

  L.geoJSON(data, {
    pointToLayer: function (feature, latlng) {
      var mag = feature.properties && feature.properties.mag;
      return L.circleMarker(latlng, {
        radius: getRadius(mag),
        fillColor: getColor(mag),
        color: "#222",
        weight: 1,
        opacity: 1,
        fillOpacity: 0.75
      });
    },
    onEachFeature: function (feature, layer) {
      var p = feature.properties || {};
      var when = p.time ? new Date(p.time).toLocaleString() : "Unknown time";
      var depth = (feature.geometry && feature.geometry.coordinates)
        ? feature.geometry.coordinates[2]
        : null;

      layer.bindPopup(
        `<b>Magnitude:</b> ${p.mag ?? "N/A"}<br>
         <b>Place:</b> ${p.place ?? "N/A"}<br>
         <b>Time:</b> ${when}<br>
         <b>Depth (km):</b> ${depth ?? "N/A"}`
      );
    }
  }).addTo(map);

  console.log("GeoJSON loaded:", data);

  // ---- helper functions ----
  function magColor(mag) {
    // pick any color scheme you like
    if (mag >= 7) return "#800026";
    if (mag >= 6) return "#BD0026";
    if (mag >= 5) return "#E31A1C";
    if (mag >= 4) return "#FC4E2A";
    if (mag >= 3) return "#FD8D3C";
    if (mag >= 2) return "#FEB24C";
    if (mag >= 1) return "#FED976";
    return "#FFEDA0";
  }

  function fmtTime(ms) {
    if (!ms) return "N/A";
    return new Date(ms).toLocaleString();
  }

  // ---- build the table ----
  const tbody = document.querySelector("#eqTable tbody");

  // (Optional) sort biggest first
  const features = [...data.features].sort(
    (a, b) => (b.properties.mag ?? -999) - (a.properties.mag ?? -999)
  );

  // (Optional) limit rows so page isn't huge
  const MAX_ROWS = 100;
  const slice = features.slice(0, MAX_ROWS);

  slice.forEach((f) => {
    const p = f.properties || {};
    const mag = p.mag;

    const tr = document.createElement("tr");

    // Time column
    const tdTime = document.createElement("td");
    tdTime.textContent = fmtTime(p.time);

    // Magnitude column (colored)
    const tdMag = document.createElement("td");
    tdMag.textContent = mag ?? "N/A";
    tdMag.style.backgroundColor = magColor(mag ?? 0);
    tdMag.style.fontWeight = "bold";

    // Place column
    const tdPlace = document.createElement("td");
    tdPlace.textContent = p.place ?? "N/A";

    tr.appendChild(tdTime);
    tr.appendChild(tdMag);
    tr.appendChild(tdPlace);

    tbody.appendChild(tr);
  });

  console.log("Built table rows:", slice.length);
</script>

</body>
</html>
