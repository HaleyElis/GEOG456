<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Homework 5</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- cna09.js must define: var cna09 = { ...JSON-stat... }; -->
  <script src="./cna09.js"></script>

  <style>
    body { font-family: Arial, sans-serif; }
    #map { height: 420px; width: 900px; background:#ddd; }

    .controls{
      width: 900px; margin: 10px 0; padding: 10px;
      border: 1px solid #ccc; border-radius: 10px; background: #fafafa;
      display:flex; gap:18px; align-items:center; flex-wrap:wrap;
    }
    label{ font-weight:bold; }

    .slider{
      -webkit-appearance:none; appearance:none; width:520px; height:16px;
      background:#d3d3d3; border-radius:10px; outline:none;
    }
    .slider::-webkit-slider-thumb{
      -webkit-appearance:none; appearance:none;
      width:18px; height:18px; background:#4CAF50; cursor:pointer; border-radius:50%;
    }

    table { width: 900px; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #999; padding: 8px; }
    th { background: #f0f0f0; }
    td.num { text-align:right; font-variant-numeric: tabular-nums; }

    .legend{
      background:white; padding:8px 10px; line-height:18px;
      border-radius:8px; border:1px solid #ccc;
    }
    .legend i{
      width:16px; height:16px; float:left; margin-right:8px; opacity:0.95;
    }
  </style>
</head>

<body>
  <h1>Population of Irish Speakers Aged 3+ (CSO CNA09)</h1>
  <h3>
    Source:
    <a href="https://data.cso.ie/" target="_blank">Central Statistics Office Ireland</a>
  </h3>

  <div class="controls">
    <div>
      <label for="statSelect">Statistic:</label>
      <select id="statSelect"></select>
    </div>

    <div>
      <label for="yearSlider">Year:</label>
      <input id="yearSlider" class="slider" type="range" min="0" max="0" value="0">
      <span id="yearLabel" style="margin-left:8px;"></span>
    </div>
  </div>

  <div id="map"></div>

  <h2>Table</h2>
  <table>
    <thead>
      <tr>
        <th>Province</th>
        <th id="colHeader">Value</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

<script>
  // -----------------------
  // Files
  // -----------------------
  var GEOJSON_FILE = "ireland_provinces.geojson";

  // -----------------------
  // Leaflet map
  // -----------------------
  var map = L.map("map").setView([53.35, -8.0], 7);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 19
  }).addTo(map);

  // -----------------------
  // UI
  // -----------------------
  var statSelect = document.getElementById("statSelect");
  var yearSlider = document.getElementById("yearSlider");
  var yearLabel  = document.getElementById("yearLabel");
  var colHeader  = document.getElementById("colHeader");
  var tbody      = document.getElementById("tbody");

  // -----------------------
  // Globals
  // -----------------------
  var provincesGeo = null;
  var layer = null;
  var legendControl = null;

  // -----------------------
  // JSON-stat
  // -----------------------
  var size   = cna09.size;    // [5,19,3]
  var values = cna09.value;
  var dim    = cna09.dimension;

  var dimProv = dim["CECONTY"].category.index;
  var dimYear = dim["TLIST(A1)"].category.index;
  var dimStat = dim["STATISTIC"].category.index;

  var provLabels = dim["CECONTY"].category.label;
  var statLabels = dim["STATISTIC"].category.label;
  var statUnits  = dim["STATISTIC"].category.unit;

  // GeoJSON province name -> dataset code
  var nameToCode = {
    "Leinster": "01",
    "Munster": "02",
    "Connacht": "03",
    "Ulster": "04"
  };

  function indexMap(arr) {
    var m = {};
    arr.forEach(function(v,i){ m[v]=i; });
    return m;
  }

  var provIndex = indexMap(dimProv);
  var yearIndex = indexMap(dimYear);
  var statIndex = indexMap(dimStat);

  // (prov, year, stat) -> flat index
  function valueAt(provCode, yearCode, statCode) {
    var p = provIndex[provCode];
    var y = yearIndex[yearCode];
    var s = statIndex[statCode];
    if (p==null || y==null || s==null) return null;
    var idx = p*(size[1]*size[2]) + y*(size[2]) + s;
    var v = values[idx];
    return (v == null) ? null : Number(v);
  }

  function normalizeProvince(name) {
    if (!name) return "";
    name = String(name).trim();
    if (name.indexOf("Ulster") === 0) return "Ulster";
    return name;
  }

  // Your GeoJSON uses props.PROVINCE
  function getProvinceNameFromGeoProps(props) {
    return normalizeProvince(props.PROVINCE);
  }

  function fmt(statCode, v) {
    if (v == null || isNaN(v)) return "N/A";
    var meta = statUnits[statCode];
    var decimals = (meta && meta.decimals != null) ? meta.decimals : 0;
    var label = (meta && meta.label) ? meta.label : "";
    var isPercent = (label === "%");
    return isPercent ? Number(v).toFixed(decimals) + "%" : Number(v).toLocaleString();
  }

  // darker blues so fill is clearly visible
  function getColor(statCode, v) {
    if (v == null || isNaN(v)) return "#cccccc";
    var isPercent = (statUnits[statCode] && statUnits[statCode].label === "%");

    if (isPercent) {
      return v < 5  ? "#deebf7" :
             v < 10 ? "#9ecae1" :
             v < 20 ? "#6baed6" :
             v < 30 ? "#3182bd" :
                      "#08519c";
    } else {
      return v < 100000  ? "#deebf7" :
             v < 250000  ? "#9ecae1" :
             v < 500000  ? "#6baed6" :
             v < 1000000 ? "#3182bd" :
                           "#08519c";
    }
  }

  function makeLegend(statCode) {
    var isPercent = (statUnits[statCode] && statUnits[statCode].label === "%");
    var grades = isPercent ? [0,5,10,20,30] : [0,100000,250000,500000,1000000];

    var legend = L.control({position:"bottomright"});
    legend.onAdd = function() {
      var div = L.DomUtil.create("div","legend");
      div.innerHTML = '<div style="font-weight:bold; margin-bottom:6px;">' +
        statLabels[statCode] + '</div>';

      for (var i=0;i<grades.length;i++){
        var from = grades[i];
        var to = grades[i+1];
        div.innerHTML +=
          '<i style="background:' + getColor(statCode, from + 0.0001) + '"></i> ' +
          from + (to ? '&ndash;' + to : '+') + '<br>';
      }
      return div;
    };
    return legend;
  }

  // Alphabetical + colored table
  function buildTable(statCode, yearCode) {
    tbody.innerHTML = "";

    var provCodes = ["01","02","03","04"];
    var rows = [];

    provCodes.forEach(function(code){
      var label = normalizeProvince(provLabels[code]); // Ulster (pt) -> Ulster
      var v = valueAt(code, yearCode, statCode);
      rows.push({ label: label, v: v });
    });

    rows.sort(function(a,b){ return a.label.localeCompare(b.label); });

    rows.forEach(function(r){
      var tr = document.createElement("tr");

      var tdP = document.createElement("td");
      tdP.textContent = r.label;

      var tdV = document.createElement("td");
      tdV.className = "num";
      tdV.textContent = fmt(statCode, r.v);

      tdV.style.backgroundColor = getColor(statCode, r.v);
      tdV.style.fontWeight = "bold";

      // white text on the darkest bin
      if (tdV.style.backgroundColor === "rgb(8, 81, 156)" || tdV.style.backgroundColor === "#08519c") {
        tdV.style.color = "white";
      }

      tr.appendChild(tdP);
      tr.appendChild(tdV);
      tbody.appendChild(tr);
    });
  }

  function render() {
    var yearCode = dimYear[Number(yearSlider.value)];
    var statCode = statSelect.value;

    yearLabel.textContent = yearCode;
    colHeader.textContent = statLabels[statCode] + " (" + yearCode + ")";

    if (legendControl) map.removeControl(legendControl);
    legendControl = makeLegend(statCode);
    legendControl.addTo(map);

    if (layer) map.removeLayer(layer);

    layer = L.geoJSON(provincesGeo, {
      style: function(feature) {
        var pName = getProvinceNameFromGeoProps(feature.properties || {});
        var provCode = nameToCode[pName] || null;
        var v = provCode ? valueAt(provCode, yearCode, statCode) : null;

        return {
          fillColor: getColor(statCode, v),
          color: "#000",
          weight: 3,
          opacity: 1,
          fillOpacity: 0.8
        };
      },
      onEachFeature: function(feature, lyr) {
        var pName = getProvinceNameFromGeoProps(feature.properties || {});
        var provCode = nameToCode[pName] || null;
        var v = provCode ? valueAt(provCode, yearCode, statCode) : null;

        lyr.bindPopup(
          "<b>Province:</b> " + (pName || "Unknown") + "<br>" +
          "<b>Year:</b> " + yearCode + "<br>" +
          "<b>" + statLabels[statCode] + ":</b> " + fmt(statCode, v)
        );
      }
    }).addTo(map);

    layer.bringToFront();
    buildTable(statCode, yearCode);
  }

  async function init() {
    var resp = await fetch(GEOJSON_FILE);
    if (!resp.ok) throw new Error("GeoJSON failed to load: " + GEOJSON_FILE);
    provincesGeo = await resp.json();

    dimStat.forEach(function(code){
      var opt = document.createElement("option");
      opt.value = code;
      opt.textContent = statLabels[code];
      statSelect.appendChild(opt);
    });
    statSelect.value = dimStat[2];

    yearSlider.min = 0;
    yearSlider.max = dimYear.length - 1;
    yearSlider.value = dimYear.length - 1; // latest year (2016)

    yearSlider.oninput = render;
    statSelect.onchange = render;

    render();
  }

  init().catch(function(err){
    console.error(err);
    alert("Load error. Use Live Server and ensure cna09.js + ireland_provinces.geojson are in the same folder.");
  });
</script>
</body>
</html>
