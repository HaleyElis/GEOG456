<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USA Hockey Women Registrations per 100k</title>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="./Women_Total.js"></script>
  <script src="./states.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f4;
    }

    h1, h2, h3 {
      text-align: center;
      margin: 8px 0;
    }

    .controls {
      text-align: center;
      margin-bottom: 16px;
    }

    .toggle-group {
      margin-top: 12px;
    }

    .toggle-group button {
      margin: 0 4px;
      padding: 8px 12px;
      border: 1px solid #888;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }

    .toggle-group button.active {
      background: #0868ac;
      color: white;
      font-weight: bold;
    }

    #chart {
      max-width: 1100px;
      margin: 0 auto;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      background: white;
      border: 2px solid #aaa;
      border-radius: 8px;
    }

    .state-outline {
      fill: #e8e8e8;
      stroke: #999;
      stroke-width: 0.7px;
    }

    .state {
      stroke: #333;
      stroke-width: 0.7px;
    }

    .state:hover {
      stroke: black;
      stroke-width: 1.4px;
    }

    .tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid #999;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      opacity: 0;
      max-width: 260px;
    }

    .legend {
      max-width: 1100px;
      margin: 14px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      font-size: 13px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 18px;
      height: 12px;
      border: 1px solid #777;
      display: inline-block;
    }

    .note {
      max-width: 1100px;
      margin: 12px auto 0;
      color: #444;
      font-size: 14px;
      text-align: center;
      line-height: 1.4;
    }

    .error {
      color: darkred;
      text-align: center;
      font-weight: bold;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <h1>Total Number of Women and Girls Registered for USA Hockey</h1>
  <h2 id="theYear">Year: 2024</h2>
  <h3 id="theMetric">Metric: Registrations per 100,000 population</h3>

  <div class="controls">
    <input
      type="range"
      min="2008"
      max="2024"
      step="1"
      value="2024"
      oninput="moveSlider(this.value)"
    />

    <div class="toggle-group">
      <button id="btn-rate" class="active" onclick="setMetric('rate')">
        Per 100,000 Population
      </button>
      <button id="btn-total" onclick="setMetric('total')">
        Total Registrations
      </button>
    </div>
  </div>

  <div id="chart"></div>
  <div id="legend" class="legend"></div>
  <div id="tooltip" class="tooltip"></div>

  <div class="note">
    Population-adjusted values are calculated as registrations ÷ state population × 100,000.
    This version reads the population CSV as rows of:
    state abbreviation, year, population.
  </div>

  <script>
    const width = 1000;
    const height = 620;

    const svg = d3.select("#chart")
      .append("svg")
      .attr("viewBox", `0 0 ${width} ${height}`);

    const tooltip = d3.select("#tooltip");

    let selectedYear = "2024";
    let selectedMetric = "rate"; // "rate" or "total"

    const populationFile = "historical_state_population_by_year.csv";
    // Data\historical_state_population_by_year.csv

    // hockey registrations lookup by abbreviation
    const womenLookup = {};

    // population lookup by abbreviation then year
    const popLookup = {};

    // copy geometry so the original global is unchanged
    const joinedStates = JSON.parse(JSON.stringify(states));

    // --------------------------
    // 1. Build women lookup
    // --------------------------
    women.forEach(row => {
      let abb = row.State_abb;

      // combine East + West Pennsylvania into PA
      if (abb === "E PA" || abb === "W PA") {
        abb = "PA";
      }

      if (!womenLookup[abb]) {
        womenLookup[abb] = {
          State_abb: abb,
          State: row.State
        };
      }

      Object.keys(row).forEach(key => {
        if (key.startsWith("X")) {
          const raw = row[key];
          const val = typeof raw === "string"
            ? Number(raw.replace(/,/g, ""))
            : Number(raw);

          womenLookup[abb][key] = (womenLookup[abb][key] || 0) + (val || 0);
        }
      });
    });

    // --------------------------
    // 2. Load population CSV
    //    expected rows like:
    //    AK,1950,135000
    // --------------------------
    d3.text(populationFile).then(function(text) {
      const rows = d3.csvParseRows(text);

      buildPopulationLookup(rows);
      joinDataToStates();
      initializeMap();
      updateMap();
    }).catch(function(error) {
      console.error("Population file could not be loaded:", error);

      d3.select("body")
        .append("div")
        .attr("class", "error")
        .text("Could not load historical_state_population_by_year.csv");
    });

    function buildPopulationLookup(rows) {
      rows.forEach(function(row) {
        if (!row || row.length < 3) return;

        const abb = String(row[0]).trim();
        const year = String(row[1]).trim();
        const population = Number(String(row[2]).replace(/,/g, "").trim());

        if (!abb || !year || !Number.isFinite(population)) return;

        if (!popLookup[abb]) {
          popLookup[abb] = {};
        }

        popLookup[abb][year] = population;
      });
    }

    // --------------------------
    // 3. Join to state geometry
    // --------------------------
    function joinDataToStates() {
      joinedStates.features.forEach(function(feature) {
        const abb =
          feature.properties.STUSPS ||
          feature.properties.STATE_ABBR ||
          feature.properties.ABBR ||
          feature.properties.STATE;

        const stateName =
          feature.properties.NAME ||
          feature.properties.STATE_NAME ||
          feature.properties.State ||
          abb;

        feature.properties.fullName = stateName;

        for (let year = 2008; year <= 2024; year++) {
          const yearStr = String(year);
          const hockeyKey = "X" + yearStr;

          const registrations =
            womenLookup[abb] && womenLookup[abb][hockeyKey]
              ? womenLookup[abb][hockeyKey]
              : 0;

          const population =
            popLookup[abb] && popLookup[abb][yearStr]
              ? popLookup[abb][yearStr]
              : 0;

          const ratePer100k =
            population > 0 ? (registrations / population) * 100000 : 0;

          feature.properties["registrations_" + yearStr] = registrations;
          feature.properties["population_" + yearStr] = population;
          feature.properties["rate_" + yearStr] = ratePer100k;
        }
      });
    }

    // --------------------------
    // 4. Projection + path
    // --------------------------
    const projection = d3.geoAlbersUsa()
      .fitSize([width, height], joinedStates);

    const path = d3.geoPath(projection);

    function initializeMap() {
      svg.append("g")
        .attr("class", "reference-layer")
        .selectAll("path")
        .data(joinedStates.features)
        .join("path")
        .attr("class", "state-outline")
        .attr("d", path);

      svg.append("g").attr("class", "cartogram-layer");
    }

    // --------------------------
    // 5. Helpers
    // --------------------------
    function getRegistrations(feature) {
      return Number(feature.properties["registrations_" + selectedYear]) || 0;
    }

    function getPopulation(feature) {
      return Number(feature.properties["population_" + selectedYear]) || 0;
    }

    function getRate(feature) {
      return Number(feature.properties["rate_" + selectedYear]) || 0;
    }

    function getValue(feature) {
      return selectedMetric === "rate"
        ? getRate(feature)
        : getRegistrations(feature);
    }

    function getColor(value) {
      if (selectedMetric === "rate") {
        return value > 250 ? "#084081" :
               value > 150 ? "#0868ac" :
               value > 100 ? "#2b8cbe" :
               value > 60  ? "#4eb3d3" :
               value > 30  ? "#7bccc4" :
               value > 10  ? "#a8ddb5" :
                             "#e0f3db";
      }

      return value > 10000 ? "#084081" :
             value > 5000  ? "#0868ac" :
             value > 2500  ? "#2b8cbe" :
             value > 1000  ? "#4eb3d3" :
             value > 500   ? "#7bccc4" :
             value > 100   ? "#a8ddb5" :
                             "#e0f3db";
    }

    function getScale(value, maxValue) {
      return d3.scaleSqrt()
        .domain([0, maxValue || 1])
        .range([0.35, 2.5])(value);
    }

    function drawLegend() {
      const legend = d3.select("#legend");
      legend.html("");

      const bins = selectedMetric === "rate"
        ? [
            { label: "0–10", color: "#e0f3db" },
            { label: "10.1–30", color: "#a8ddb5" },
            { label: "30.1–60", color: "#7bccc4" },
            { label: "60.1–100", color: "#4eb3d3" },
            { label: "100.1–150", color: "#2b8cbe" },
            { label: "150.1–250", color: "#0868ac" },
            { label: "250+", color: "#084081" }
          ]
        : [
            { label: "0–100", color: "#e0f3db" },
            { label: "101–500", color: "#a8ddb5" },
            { label: "501–1,000", color: "#7bccc4" },
            { label: "1,001–2,500", color: "#4eb3d3" },
            { label: "2,501–5,000", color: "#2b8cbe" },
            { label: "5,001–10,000", color: "#0868ac" },
            { label: "10,001+", color: "#084081" }
          ];

      bins.forEach(function(item) {
        const div = legend.append("div").attr("class", "legend-item");

        div.append("span")
          .attr("class", "legend-swatch")
          .style("background", item.color);

        div.append("span").text(item.label);
      });
    }

    function updateTitles() {
      d3.select("#theYear").text(`Year: ${selectedYear}`);
      d3.select("#theMetric").text(
        selectedMetric === "rate"
          ? "Metric: Registrations per 100,000 population"
          : "Metric: Total registrations"
      );

      document.getElementById("btn-rate").classList.toggle("active", selectedMetric === "rate");
      document.getElementById("btn-total").classList.toggle("active", selectedMetric === "total");
    }

    // --------------------------
    // 6. Draw/update cartogram
    // --------------------------
    function updateMap() {
      const maxValue = d3.max(joinedStates.features, d => getValue(d)) || 1;

      svg.select(".cartogram-layer")
        .selectAll(".state")
        .data(joinedStates.features, d => d.properties.STATE || d.properties.NAME)
        .join("path")
        .attr("class", "state")
        .attr("d", path)
        .attr("fill", d => getColor(getValue(d)))
        .attr("transform", function(d) {
          const value = getValue(d);
          const scale = getScale(value, maxValue);
          const centroid = path.centroid(d);

          if (!Number.isFinite(centroid[0]) || !Number.isFinite(centroid[1])) {
            return null;
          }

          const cx = centroid[0];
          const cy = centroid[1];

          return `translate(${cx},${cy}) scale(${scale}) translate(${-cx},${-cy})`;
        })
        .on("mousemove", function(event, d) {
          const stateName = d.properties.fullName || d.properties.NAME || "Unknown";
          const registrations = getRegistrations(d);
          const population = getPopulation(d);
          const rate = getRate(d);

          tooltip
            .style("opacity", 1)
            .style("left", `${event.pageX + 12}px`)
            .style("top", `${event.pageY + 12}px`)
            .html(`
              <strong>${stateName}</strong><br>
              Year: ${selectedYear}<br>
              Registrations: ${registrations.toLocaleString()}<br>
              Population: ${population.toLocaleString()}<br>
              Per 100,000: ${rate.toFixed(1)}
            `);
        })
        .on("mouseleave", function() {
          tooltip.style("opacity", 0);
        });

      drawLegend();
      updateTitles();
    }

    function moveSlider(value) {
      selectedYear = value;
      updateMap();
    }

    function setMetric(metric) {
      selectedMetric = metric;
      updateMap();
    }
  </script>
</body>
</html>
