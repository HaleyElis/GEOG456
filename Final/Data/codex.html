<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PWHL + Olympics Hockey Game Animator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f5f7fb;
      color: #111;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      padding: 1rem 1.25rem 1.5rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0.25rem 0 0.5rem;
      font-size: 1.6rem;
    }

    .subtitle {
      margin: 0 0 0.8rem;
      color: #3f3f46;
    }

    .tab-row,
    .controls,
    .subcontrols {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      align-items: center;
      margin-bottom: 0.85rem;
    }

    .tab-btn {
      padding: 0.45rem 0.8rem;
      border: 1px solid #cbd5e1;
      border-radius: 999px;
      background: #f8fafc;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #1d4ed8;
      border-color: #1d4ed8;
      color: #fff;
    }

    button,
    select,
    input {
      font-size: 0.95rem;
      padding: 0.45rem 0.65rem;
      border-radius: 8px;
      border: 1px solid #bbb;
      background: #fff;
    }

    .status {
      font-weight: bold;
      color: #1d4e89;
    }

    .rink-wrapper {
      overflow-x: auto;
      border: 1px solid #dce3ef;
      border-radius: 10px;
      background: #f9fcff;
      padding: 0.75rem;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 920px;
      height: auto;
      background: #fff;
    }

    .caption {
      margin-top: 0.75rem;
      font-size: 0.95rem;
      color: #374151;
      min-height: 1.4rem;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 0.65rem;
      font-size: 0.9rem;
    }

    .dot {
      width: 0.8rem;
      height: 0.8rem;
      display: inline-block;
      border-radius: 50%;
      margin-right: 0.35rem;
      vertical-align: middle;
    }

    .note {
      margin-top: 1rem;
      padding: 0.75rem;
      border-left: 3px solid #64748b;
      background: #f1f5f9;
      font-size: 0.9rem;
    }

    .pill {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: bold;
      line-height: 1.4;
    }

    .pill-goal {
      background: #fee2e2;
      color: #991b1b;
    }

    .pill-shot {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .hidden {
      display: none !important;
    }

    label {
      font-size: 0.93rem;
    }

    .meta {
      color: #4b5563;
      font-size: 0.9rem;
    }

    .warn {
      color: #92400e;
      font-weight: 600;
    }

    .success {
      color: #166534;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hockey Game Animation (PWHL + Olympics)</h1>
    <p class="subtitle">
      Animate shot and goal locations for PWHL games and Olympic women’s hockey games.
    </p>

    <div class="tab-row">
      <button class="tab-btn active" data-mode="pwhl">PWHL</button>
      <button class="tab-btn" data-mode="olympics">Olympic Games (Women)</button>
    </div>

    <div class="subcontrols" id="pwhl-controls">
      <label for="pwhl-season-select">PWHL season:</label>
      <select id="pwhl-season-select">
        <option value="auto">Auto / try all</option>
        <option value="6">Season ID 6</option>
        <option value="5">Season ID 5</option>
        <option value="4">Season ID 4</option>
      </select>

      <label for="pwhl-game-id">Manual game ID:</label>
      <input id="pwhl-game-id" type="text" placeholder="Optional fallback game_id" />

      <button id="manual-game-btn" type="button">Load manual game ID</button>
      <span class="meta">If the live schedule feed is empty, use a known game_id here.</span>
    </div>

    <div class="controls">
      <label for="event-filter">Show:</label>
      <select id="event-filter">
        <option value="all">Goals + Shots</option>
        <option value="goals">Goals only</option>
      </select>

      <label for="game-select">Game:</label>
      <select id="game-select"></select>

      <button id="load-btn">Load game events</button>
      <button id="play-btn">▶ Play</button>
      <button id="reset-btn">↺ Reset</button>
      <span class="status" id="status">Ready</span>
    </div>

    <div class="rink-wrapper">
      <svg id="rink" viewBox="0 0 200 85" aria-label="Hockey rink"></svg>
    </div>

    <div class="legend">
      <span><span class="dot" style="background:#c8102e;"></span>Home / Team A</span>
      <span><span class="dot" style="background:#1f4e79;"></span>Away / Team B</span>
      <span>★ Goal</span>
      <span>● Shot</span>
      <span><span class="dot" style="background:#111;"></span>Current event outline</span>
    </div>

    <p class="caption" id="caption"></p>

    <div class="note" id="note">
      Data source mode: <strong>PWHL HockeyTech API</strong>.
    </div>
  </div>

  <script>
    const PWHL_CFG = {
      seasonIds: [6, 5, 4],
      key: "446521baf8c38984",
      client_code: "pwhl",
      base: "https://lscluster.hockeytech.com/feed/index.php"
    };

    const OLY_CSV_URL =
      "https://raw.githubusercontent.com/the-bucketless/bdc/main/data/pxp_womens_oly_2022_v2.csv";

    const svg = document.getElementById("rink");
    const select = document.getElementById("game-select");
    const loadBtn = document.getElementById("load-btn");
    const playBtn = document.getElementById("play-btn");
    const resetBtn = document.getElementById("reset-btn");
    const captionEl = document.getElementById("caption");
    const statusEl = document.getElementById("status");
    const noteEl = document.getElementById("note");
    const tabButtons = [...document.querySelectorAll(".tab-btn")];
    const pwhlControls = document.getElementById("pwhl-controls");
    const pwhlSeasonSelect = document.getElementById("pwhl-season-select");
    const pwhlGameIdInput = document.getElementById("pwhl-game-id");
    const manualGameBtn = document.getElementById("manual-game-btn");
    const eventFilterSelect = document.getElementById("event-filter");

    let mode = "pwhl";
    let animationHandle = null;
    let animationIndex = -1;
    let games = [];
    let allEvents = [];
    let activeEvents = [];

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function fmtIsoDate(v) {
      return String(v || "").slice(0, 10);
    }

    function formatDateDMY(isoDate) {
      if (!isoDate || !/^\d{4}-\d{2}-\d{2}$/.test(isoDate)) return isoDate || "";
      const [yyyy, mm, dd] = isoDate.split("-");
      return `${dd}/${mm}/${yyyy}`;
    }

    function safeNumber(v) {
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function drawRink() {
      svg.innerHTML = [
        '<rect x="0.5" y="0.5" width="199" height="84" rx="10" ry="10" fill="#ffffff" stroke="#7aa4cf" stroke-width="1"/>',
        '<line x1="100" y1="1" x2="100" y2="84" stroke="#d62828" stroke-width="1"/>',
        '<line x1="75" y1="1" x2="75" y2="84" stroke="#1f78b4" stroke-width="0.8"/>',
        '<line x1="125" y1="1" x2="125" y2="84" stroke="#1f78b4" stroke-width="0.8"/>',
        '<circle cx="100" cy="42.5" r="9" fill="none" stroke="#d62828" stroke-width="0.8"/>',
        '<rect x="0.5" y="32" width="6" height="21" fill="none" stroke="#d62828" stroke-width="0.8"/>',
        '<rect x="193.5" y="32" width="6" height="21" fill="none" stroke="#d62828" stroke-width="0.8"/>'
      ].join("");
    }

    function stopAnimation() {
      if (animationHandle) {
        clearInterval(animationHandle);
        animationHandle = null;
      }
    }

    function parsePeriodValue(periodRaw) {
      const m = String(periodRaw || "").match(/\d+/);
      return m ? Number(m[0]) : 0;
    }

    function parseClockToSeconds(clockRaw) {
      if (typeof clockRaw === "number" && Number.isFinite(clockRaw)) return clockRaw;

      const s = String(clockRaw || "").trim();
      const match = s.match(/(\d{1,2}):(\d{2})/);
      if (!match) return 0;

      return Number(match[1]) * 60 + Number(match[2]);
    }

    function buildSortKey(periodRaw, clockRaw) {
      const period = parsePeriodValue(periodRaw);
      const seconds = parseClockToSeconds(clockRaw);
      return period * 100000 + seconds;
    }

    function formatClock(periodRaw, clockSecondsRaw) {
      const total = Number(clockSecondsRaw || 0);
      const mins = Math.floor(total / 60);
      const secs = total % 60;
      return `P${parsePeriodValue(periodRaw)} ${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    function classifyEvent(raw) {
      const ev = String(raw || "").trim().toUpperCase();
      if (!ev) return null;

      if (
        ev.includes("NO GOAL") ||
        ev.includes("DISALLOWED GOAL") ||
        ev.includes("GOAL DISALLOWED") ||
        ev.includes("WAVED OFF") ||
        ev.includes("WAVE OFF")
      ) {
        return null;
      }

      if (
        ev === "GOAL" ||
        ev.endsWith(" GOAL") ||
        ev.includes("GOAL SCORED") ||
        ev.includes("PPG") ||
        ev.includes("SHG")
      ) {
        return "goal";
      }

      if (
        ev.includes("SHOT") ||
        ev.includes("WRIST SHOT") ||
        ev.includes("SNAP SHOT") ||
        ev.includes("SLAP SHOT") ||
        ev.includes("BACKHAND") ||
        ev.includes("TIP-IN") ||
        ev.includes("DEFLECTED")
      ) {
        return "shot";
      }

      return null;
    }

    function starPoints(cx, cy, outerR = 3.2, innerR = 1.45, spikes = 5) {
      let rot = Math.PI / 2 * 3;
      const step = Math.PI / spikes;
      const points = [];

      for (let i = 0; i < spikes; i++) {
        let x = cx + Math.cos(rot) * outerR;
        let y = cy + Math.sin(rot) * outerR;
        points.push(`${x},${y}`);
        rot += step;

        x = cx + Math.cos(rot) * innerR;
        y = cy + Math.sin(rot) * innerR;
        points.push(`${x},${y}`);
        rot += step;
      }

      return points.join(" ");
    }

    function getFirstNumber(obj, keys) {
      for (const key of keys) {
        const value = obj?.[key];
        const n = safeNumber(value);
        if (n !== null) return n;
      }
      return null;
    }

    function pickCoordinateBundle(row) {
      const rawX = getFirstNumber(row, [
        "x_raw", "raw_x", "xcoord_raw", "coord_x_raw", "event_coord_x_raw"
      ]);
      const rawY = getFirstNumber(row, [
        "y_raw", "raw_y", "ycoord_raw", "coord_y_raw", "event_coord_y_raw"
      ]);

      if (rawX !== null && rawY !== null) {
        return { x: rawX, y: rawY, source: "raw" };
      }

      const standardX = getFirstNumber(row, [
        "x_coord", "coord_x", "event_coord_x", "xcoord", "x", "x_transformed"
      ]);
      const standardY = getFirstNumber(row, [
        "y_coord", "coord_y", "event_coord_y", "ycoord", "y", "y_transformed"
      ]);

      if (standardX !== null && standardY !== null) {
        return { x: standardX, y: standardY, source: "derived" };
      }

      return null;
    }

    function mapRawToRink(x, y) {
      if (x >= -100 && x <= 100 && y >= -42.5 && y <= 42.5) {
        return { x: x + 100, y: y + 42.5 };
      }

      if (x >= 0 && x <= 200 && y >= 0 && y <= 85) {
        return { x, y };
      }

      return null;
    }

    function mapAttackNormalizedToFullRink(x, y, teamSide, period) {
      if (!(x >= 0 && x <= 100 && y >= -42.5 && y <= 42.5)) return null;

      const p = parsePeriodValue(period) || 1;
      const teamAttacksRight =
        teamSide === "home"
          ? (p % 2 === 1)
          : (p % 2 === 0);

      const rinkX = teamAttacksRight ? (100 + x) : (100 - x);
      const rinkY = y + 42.5;

      if (rinkX < 0 || rinkX > 200 || rinkY < 0 || rinkY > 85) return null;
      return { x: rinkX, y: rinkY };
    }

    function normalizeEventCoord(row, teamSide, period) {
      const bundle = pickCoordinateBundle(row);
      if (!bundle) return null;

      if (bundle.source === "raw") {
        return mapRawToRink(bundle.x, bundle.y);
      }

      const direct = mapRawToRink(bundle.x, bundle.y);
      if (direct && !(bundle.x >= 0 && bundle.x <= 100 && bundle.y >= -42.5 && bundle.y <= 42.5)) {
        return direct;
      }

      const attackNormalized = mapAttackNormalizedToFullRink(bundle.x, bundle.y, teamSide, period);
      if (attackNormalized) return attackNormalized;

      return direct;
    }

    function renderEventShape(e, current = false) {
      const teamColor = e.side === "home" ? "#c8102e" : "#1f4e79";

      if (e.type === "goal") {
        return `
          <polygon
            class="${current ? "puck" : "event-dot"}"
            points="${starPoints(e.x, e.y, current ? 3.9 : 3.2, current ? 1.75 : 1.45)}"
            fill="${teamColor}"
            stroke="${current ? "#111" : "#ffffff"}"
            stroke-width="${current ? 0.9 : 0.5}"
            opacity="0.98"
          ></polygon>
        `;
      }

      return `
        <circle
          class="${current ? "puck" : "event-dot"}"
          cx="${e.x}"
          cy="${e.y}"
          r="${current ? 2.6 : 1.95}"
          fill="${teamColor}"
          stroke="${current ? "#111" : "none"}"
          stroke-width="${current ? 0.75 : 0}"
          opacity="0.92"
        ></circle>
      `;
    }

    function renderEvents(upto = -1) {
      svg.querySelectorAll(".event-dot,.event-label,.puck").forEach((n) => n.remove());

      for (let i = 0; i <= upto; i += 1) {
        const e = activeEvents[i];
        svg.insertAdjacentHTML("beforeend", renderEventShape(e, false));
        svg.insertAdjacentHTML(
          "beforeend",
          `<text class="event-label" x="${e.x + 2}" y="${e.y - 2}" font-size="2.5" fill="#111">${escapeHtml(e.clock)}</text>`
        );
      }

      if (upto >= 0) {
        const e = activeEvents[upto];
        svg.insertAdjacentHTML("beforeend", renderEventShape(e, true));

        captionEl.innerHTML =
          `${escapeHtml(e.clock)} — ${escapeHtml(e.description)} ` +
          (e.type === "goal"
            ? `<span class="pill pill-goal">GOAL</span>`
            : `<span class="pill pill-shot">SHOT</span>`);
      } else {
        captionEl.textContent = activeEvents.length
          ? `Loaded ${activeEvents.length} plottable events. Press Play.`
          : "No plottable events loaded yet.";
      }
    }

    function resetView() {
      stopAnimation();
      animationIndex = -1;
      renderEvents(-1);
      setStatus(activeEvents.length ? `Loaded ${activeEvents.length} events` : "Ready");
      playBtn.textContent = "▶ Play";
    }

    function playAnimation() {
      if (!activeEvents.length) {
        setStatus("No events loaded");
        captionEl.textContent = "Load a game first.";
        return;
      }

      if (animationHandle) {
        stopAnimation();
        setStatus("Paused");
        playBtn.textContent = "▶ Play";
        return;
      }

      if (animationIndex >= activeEvents.length - 1) {
        animationIndex = -1;
      }

      setStatus("Playing...");
      playBtn.textContent = "⏸ Pause";

      animationHandle = setInterval(() => {
        animationIndex += 1;
        if (animationIndex >= activeEvents.length) {
          stopAnimation();
          setStatus("Complete");
          playBtn.textContent = "▶ Play";
          return;
        }
        renderEvents(animationIndex);
      }, 850);
    }

    function applyEventFilter() {
      activeEvents = eventFilterSelect.value === "goals"
        ? allEvents.filter((e) => e.type === "goal")
        : [...allEvents];

      activeEvents.sort((a, b) => a.sortKey - b.sortKey);
      resetView();
    }

    function populateGameSelect() {
      select.innerHTML = "";

      if (!games.length) {
        const empty = document.createElement("option");
        empty.textContent = "No games found";
        empty.value = "";
        select.appendChild(empty);
        return;
      }

      for (const g of games) {
        const opt = document.createElement("option");
        opt.value = g.id;
        opt.textContent = g.label;
        select.appendChild(opt);
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const text = await response.text();
      try {
        return JSON.parse(text);
      } catch {
        const trimmed = text.replace(/^[^(]*\(/, "").replace(/\);?\s*$/, "");
        return JSON.parse(trimmed);
      }
    }

    function toArray(obj) {
      if (Array.isArray(obj)) return obj;

      if (obj && typeof obj === "object") {
        for (const value of Object.values(obj)) {
          if (Array.isArray(value)) return value;
        }
      }

      return [];
    }

    function parseCsv(text) {
      const out = [];
      let row = [];
      let value = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const n = text[i + 1];

        if (c === '"') {
          if (inQuotes && n === '"') {
            value += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === "," && !inQuotes) {
          row.push(value);
          value = "";
        } else if ((c === "\n" || c === "\r") && !inQuotes) {
          if (c === "\r" && n === "\n") i++;
          row.push(value);
          value = "";
          if (row.some((x) => x !== "")) out.push(row);
          row = [];
        } else {
          value += c;
        }
      }

      if (value || row.length) {
        row.push(value);
        out.push(row);
      }

      const [header, ...rows] = out;
      return rows.map((r) => Object.fromEntries(header.map((h, idx) => [h, r[idx] || ""])));
    }

    function extractScheduleRows(payload, seasonId) {
      const rows = toArray(payload);

      return rows
        .map((r) => {
          const id = r.game_id || r.id || r.GameID || r.gameid;
          const date = fmtIsoDate(r.date || r.game_date || r.gamedate || r.start_datetime || "");
          const home = r.home_team || r.home || r.home_team_name || r.HomeTeam || "Home";
          const away = r.visiting_team || r.away || r.away_team_name || r.AwayTeam || "Away";

          return {
            id: String(id || ""),
            date,
            home,
            away,
            seasonId
          };
        })
        .filter((g) => g.id && g.date)
        .sort((a, b) => a.date.localeCompare(b.date));
    }

    async function loadPwhlSchedule() {
      setStatus("Loading PWHL schedule...");
      noteEl.innerHTML =
        "Data source mode: <strong>PWHL HockeyTech API</strong>. If schedule loading fails, use manual game_id.";

      const selected = pwhlSeasonSelect.value;
      const seasonIds = selected === "auto" ? PWHL_CFG.seasonIds : [Number(selected)];
      let bestGames = [];
      let lastError = null;

      for (const sid of seasonIds) {
        const url =
          `${PWHL_CFG.base}?feed=modulekit&view=schedule&season_id=${sid}` +
          `&key=${PWHL_CFG.key}&client_code=${PWHL_CFG.client_code}`;

        try {
          const payload = await fetchJson(url);
          const parsed = extractScheduleRows(payload, sid).map((g) => ({
            ...g,
            label: `${formatDateDMY(g.date)} — ${g.away} @ ${g.home} (SID ${sid})`
          }));

          if (parsed.length > bestGames.length) bestGames = parsed;
        } catch (error) {
          lastError = error;
        }
      }

      games = bestGames;
      populateGameSelect();

      if (games.length) {
        setStatus(`Loaded ${games.length} PWHL games`);
        captionEl.innerHTML = `<span class="success">PWHL schedule loaded.</span>`;
      } else {
        setStatus("No PWHL schedule data found");
        captionEl.innerHTML =
          `<span class="warn">Live PWHL schedule did not load.</span> ` +
          `Try another season or enter a manual game_id.`;
        if (lastError) {
          noteEl.innerHTML =
            `Data source mode: <strong>PWHL HockeyTech API</strong>. ` +
            `Schedule fetch failed in this browser: <code>${escapeHtml(lastError.message)}</code>`;
        }
      }
    }

    async function loadOlympicsSchedule() {
      setStatus("Loading Olympic games...");
      noteEl.innerHTML =
        "Data source mode: <strong>the-bucketless/bdc Olympic dataset (2022)</strong>.";

      const response = await fetch(OLY_CSV_URL);
      if (!response.ok) throw new Error("Olympics CSV unavailable");

      const rows = parseCsv(await response.text());
      const grouped = new Map();

      for (const r of rows) {
        const date = fmtIsoDate(r.game_date || r.date || "");
        const teamA = (r.team_name || r.team || "Team").trim();
        const teamB = (r.opp_team_name || r.opponent || "Opponent").trim();
        if (!date || !teamA || !teamB) continue;

        const pair = [teamA, teamB].sort((a, b) => a.localeCompare(b));
        const gameKey = `${date}__${pair[0]}__${pair[1]}`;

        if (!grouped.has(gameKey)) {
          grouped.set(gameKey, {
            id: gameKey,
            date,
            home: pair[0],
            away: pair[1],
            rows: []
          });
        }

        grouped.get(gameKey).rows.push(r);
      }

      games = [...grouped.values()]
        .sort((a, b) => a.date.localeCompare(b.date) || a.away.localeCompare(b.away))
        .map((g) => ({
          ...g,
          label: `${formatDateDMY(g.date)} — ${g.away} vs ${g.home}`
        }));

      populateGameSelect();
      setStatus(`Loaded ${games.length} Olympic game groups`);
    }

    function extractEventsFromPwhl(payload) {
      const rows = toArray(payload);
      const events = [];

      for (const r of rows) {
        const type = classifyEvent(r.event || r.event_type || r.description || r.play_description);
        if (!type) continue;

        const period = r.period || r.period_of_game || r.per || "1";
        const clock = r.time || r.clock || r.game_clock || r.time_of_period || "00:00";
        const team = r.team || r.team_name || r.event_team || r.team_short || r.team_abbrev || "Team";

        const homeName = r.home_team || r.home || r.home_team_name || "";
        const awayName = r.away_team || r.visiting_team || r.away_team_name || "";

        let side = "away";
        if (homeName && team && String(team).toUpperCase() === String(homeName).toUpperCase()) side = "home";
        else if (awayName && team && String(team).toUpperCase() === String(awayName).toUpperCase()) side = "away";

        const coord = normalizeEventCoord(r, side, period);
        if (!coord) continue;

        events.push({
          x: coord.x,
          y: coord.y,
          side,
          type,
          period: parsePeriodValue(period),
          clock: String(clock),
          sortKey: buildSortKey(period, clock),
          description: `${team} ${type.toUpperCase()} (P${parsePeriodValue(period)})`
        });
      }

      return events;
    }

    function extractEventsFromOlympics(game) {
      const rows = game.rows || [];
      const seen = new Set();
      const events = [];

      for (const r of rows) {
        const type = classifyEvent(r.event);
        if (!type) continue;

        const period = r.period || "1";
        const team = (r.team_name || r.team || "Team").trim();
        const side = team === game.home ? "home" : "away";

        const coord = normalizeEventCoord(r, side, period);
        if (!coord) continue;

        const clockSeconds = Number(r.clock_seconds || 0);
        const key = [
          parsePeriodValue(period),
          clockSeconds,
          team,
          type,
          coord.x.toFixed(1),
          coord.y.toFixed(1)
        ].join("__");

        if (seen.has(key)) continue;
        seen.add(key);

        events.push({
          x: coord.x,
          y: coord.y,
          side,
          type,
          period: parsePeriodValue(period),
          clock: formatClock(period, clockSeconds),
          sortKey: buildSortKey(period, clockSeconds),
          description: `${team} ${type.toUpperCase()}`
        });
      }

      return events;
    }

    async function loadGameEventsById(gameId) {
      setStatus("Loading PWHL game events...");
      const url =
        `${PWHL_CFG.base}?feed=gc&tab=pxpverbose&game_id=${encodeURIComponent(gameId)}` +
        `&key=${PWHL_CFG.key}&client_code=${PWHL_CFG.client_code}`;

      const payload = await fetchJson(url);
      allEvents = extractEventsFromPwhl(payload);
      applyEventFilter();
    }

    async function loadSelectedGameEvents() {
      const game = games.find((g) => g.id === select.value);
      if (!game) {
        setStatus("Select a game first");
        return;
      }

      try {
        if (mode === "pwhl") {
          await loadGameEventsById(game.id);
        } else {
          setStatus("Loading Olympic game events...");
          allEvents = extractEventsFromOlympics(game);
          applyEventFilter();
        }
      } catch (error) {
        allEvents = [];
        activeEvents = [];
        resetView();
        setStatus("Event load failed");
        captionEl.textContent = `Could not load events: ${error.message}`;
      }
    }

    async function loadManualPwhlGame() {
      const gameId = pwhlGameIdInput.value.trim();
      if (!gameId) {
        setStatus("Enter a manual game_id first");
        return;
      }

      try {
        await loadGameEventsById(gameId);
        captionEl.innerHTML =
          `<span class="success">Loaded manual PWHL game_id ${escapeHtml(gameId)}.</span>`;
      } catch (error) {
        allEvents = [];
        activeEvents = [];
        resetView();
        setStatus("Manual game load failed");
        captionEl.textContent = `Could not load manual game_id ${gameId}: ${error.message}`;
      }
    }

    async function switchMode(nextMode) {
      mode = nextMode;
      tabButtons.forEach((btn) => btn.classList.toggle("active", btn.dataset.mode === mode));
      pwhlControls.classList.toggle("hidden", mode !== "pwhl");

      games = [];
      allEvents = [];
      activeEvents = [];
      populateGameSelect();
      resetView();

      try {
        if (mode === "pwhl") {
          await loadPwhlSchedule();
        } else {
          await loadOlympicsSchedule();
        }
      } catch (error) {
        games = [];
        populateGameSelect();
        setStatus("Load failed");
        captionEl.textContent = error.message;
      }
    }

    tabButtons.forEach((btn) => {
      btn.addEventListener("click", () => switchMode(btn.dataset.mode));
    });

    pwhlSeasonSelect.addEventListener("change", () => {
      if (mode === "pwhl") switchMode("pwhl");
    });

    manualGameBtn.addEventListener("click", loadManualPwhlGame);
    eventFilterSelect.addEventListener("change", applyEventFilter);
    loadBtn.addEventListener("click", loadSelectedGameEvents);
    playBtn.addEventListener("click", playAnimation);
    resetBtn.addEventListener("click", resetView);

    drawRink();
    switchMode("pwhl");
  </script>
</body>
</html>
