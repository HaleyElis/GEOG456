<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Hockey</title>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="../pwhl_schedule.js?v=4"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #fafafa;
    }

    h1, h2 {
      text-align: center;
      margin: 8px 0;
    }

    .controls {
      text-align: center;
      margin-bottom: 16px;
    }

    .controls select,
    .controls button {
      font-size: 16px;
      padding: 8px 10px;
      margin: 4px;
    }

    #chart {
      max-width: 820px;
      margin: 0 auto;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      background: white;
      border: 2px solid #aaa;
      border-radius: 8px;
    }

    .legend {
      max-width: 820px;
      margin: 12px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      font-size: 16px;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .meta {
      max-width: 820px;
      margin: 14px auto 0;
      font-size: 18px;
      text-align: left;
    }

    .status {
      color: #2f5597;
      font-weight: 700;
      margin-left: 10px;
    }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e9eefb;
      color: #3459c9;
      font-size: 13px;
      font-weight: 700;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <h1>Visualizing Women's Hockey</h1>
  <h2>Shots and Goals in PWHL and Olympic Games</h2>

  <div class="controls">
    <label>Dataset:</label>
    <select id="datasetSelect">
      <option value="pwhl">PWHL</option>
      <option value="olympics_2022">Olympics 2022</option>
    </select>

    <label>Game:</label>
    <select id="gameSelect"></select>

    <button id="loadBtn">Load</button>
    <button id="playBtn">Play</button>
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>

    <span id="status">No events loaded</span>
  </div>

  <div id="chart"></div>

  <div id="eventMeta"></div>

<script>
const BDC_URL = "https://raw.githubusercontent.com/the-bucketless/bdc/main/data/pxp_womens_oly_2022_v2.csv";

const width = 200;
const height = 85;

const HOME_COLOR = "#c41e3a";
const AWAY_COLOR = "#355c97";
const HOME_SHOT_FILL = "rgba(196,30,58,0.22)";
const AWAY_SHOT_FILL = "rgba(53,92,151,0.22)";
const OUTLINE_COLOR = "#111";

let svg, schedule = [], events = [];
let currentIndex = -1, timer = null, bdcRows = null;

const chart = document.getElementById("chart");
const datasetSelect = document.getElementById("datasetSelect");
const gameSelect = document.getElementById("gameSelect");
const statusEl = document.getElementById("status");
const eventMeta = document.getElementById("eventMeta");

function createSVG() {
  chart.innerHTML = "";
  svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  chart.appendChild(svg);
}

function el(name, attrs) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", name);
  Object.entries(attrs).forEach(([k,v]) => node.setAttribute(k,v));
  return node;
}

function drawRink() {
  createSVG();

  svg.appendChild(el("rect",{x:2,y:2,width:196,height:81,rx:10,fill:"#f8f8f8",stroke:"#7ea0cf"}));
  svg.appendChild(el("line",{x1:75,y1:2,x2:75,y2:83,stroke:"#2c6db4"}));
  svg.appendChild(el("line",{x1:125,y1:2,x2:125,y2:83,stroke:"#2c6db4"}));
  svg.appendChild(el("line",{x1:100,y1:2,x2:100,y2:83,stroke:"#cf2f2f"}));
}

function secondsToClock(s){
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60);
  return `${m}:${String(sec).padStart(2,"0")}`;
}

function buildOlympicsGameId(row){
  const d = row.game_date.slice(0,10);
  const t = [row.team_name,row.opp_team_name].sort();
  return `${d}__${t[0]}__${t[1]}`;
}

function buildOlympicsSchedule(rows){
  const map = new Map();
  rows.forEach(r=>{
    const id = buildOlympicsGameId(r);
    if(map.has(id)) return;
    map.set(id,{
      game_id:id,
      game_date:r.game_date.slice(0,10),
      home_team:r.team_name,
      away_team:r.opp_team_name,
      label:`${r.game_date.slice(0,10)} — ${r.opp_team_name} @ ${r.team_name}`
    });
  });
  return [...map.values()];
}

function buildOlympicsEvents(gameId) {
  const gameRows = bdcRows.filter(row => buildOlympicsGameId(row) === gameId);

  return gameRows.map(row => {
    const rawEvent = String(row.event || "").toLowerCase();

    let eventType = null;
    if (rawEvent.includes("goal")) eventType = "goal";
    else if (rawEvent.includes("shot")) eventType = "shot";

    const xRaw = parseFloat(row.x_coord);
    const yRaw = parseFloat(row.y_coord);

    // THIS IS THE CRITICAL FIX
    if (!eventType || isNaN(xRaw) || isNaN(yRaw)) return null;

    return {
      game_id: gameId,
      team: (row.team_name || "").trim(),
      period: Number(row.period),
      clock: secondsToClock(row.clock_seconds),
      event_type: eventType,
      x: xRaw + 100,
      y: yRaw + 42.5
    };
  }).filter(Boolean);
}

function normalizeEvent(e,game){
  let color = AWAY_COLOR, fill = AWAY_SHOT_FILL;

  if(e.team.includes(game.home_team)){
    color = HOME_COLOR;
    fill = HOME_SHOT_FILL;
  }

  let x = e.x;
  if(e.period % 2 === 0) x = 200 - x;

  return {...e,plotX:x,plotY:e.y,color,fill};
}

function render(idx){
  drawRink();
  const game = schedule.find(g=>g.game_id==gameSelect.value);

  events.forEach((ev,i)=>{
    if(i>idx) return;

    const e = normalizeEvent(ev,game);

    const node = e.event_type==="goal"
      ? el("circle",{cx:e.plotX,cy:e.plotY,r:2,fill:e.color})
      : el("circle",{cx:e.plotX,cy:e.plotY,r:1,fill:e.fill});

    if(i===idx){
      node.setAttribute("stroke",OUTLINE_COLOR);
      node.setAttribute("stroke-width",0.5);
    }

    svg.appendChild(node);
  });
}

function loadSchedule(){
  if(datasetSelect.value==="pwhl"){
    schedule = window.pwhl_schedule;
    fillDropdown();
    return;
  }

  d3.csv(BDC_URL).then(data=>{
    bdcRows = data.map(d=>({
      ...d,
      clock_seconds:+d.clock_seconds,
      x_coord:+d.x_coord,
      y_coord:+d.y_coord
    }));
    schedule = buildOlympicsSchedule(bdcRows);
    fillDropdown();
  });
}

function fillDropdown(){
  gameSelect.innerHTML="";
  schedule.forEach(g=>{
    const o=document.createElement("option");
    o.value=g.game_id;
    o.textContent=g.label;
    gameSelect.appendChild(o);
  });
}

function loadGame(){
  const game = gameSelect.value;

  if(datasetSelect.value==="pwhl"){
    events = window[`pwhl_game_${game}`] || [];
  } else {
    events = buildOlympicsEvents(game);
  }

  events.sort((a,b)=>a.period-b.period);
  render(-1);
}

document.getElementById("loadBtn").onclick=loadGame;
document.getElementById("playBtn").onclick=()=>{
  timer=setInterval(()=>{
    currentIndex++;
    if(currentIndex>=events.length){clearInterval(timer);}
    render(currentIndex);
  },600);
};
document.getElementById("pauseBtn").onclick=()=>clearInterval(timer);
document.getElementById("resetBtn").onclick=()=>{currentIndex=-1;render(-1);};

datasetSelect.onchange=loadSchedule;

drawRink();
loadSchedule();
</script>
</body>
</html>
