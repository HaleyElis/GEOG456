<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hockey Game Animation Draft</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #fafafa;
    }

    h1, h2, h3 {
      text-align: center;
      margin: 8px 0;
    }

    .controls {
      text-align: center;
      margin-bottom: 16px;
    }

    .controls select,
    .controls button {
      font-size: 16px;
      padding: 8px 10px;
      margin: 4px;
    }

    #chart {
      max-width: 1400px;
      margin: 0 auto;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      background: white;
      border: 2px solid #aaa;
      border-radius: 8px;
    }

    .legend {
      max-width: 1400px;
      margin: 12px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      font-size: 18px;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
    }

    .meta {
      max-width: 1400px;
      margin: 14px auto 0;
      font-size: 18px;
      text-align: left;
    }

    .status {
      color: #2f5597;
      font-weight: 700;
      margin-left: 10px;
    }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e9eefb;
      color: #3459c9;
      font-size: 13px;
      font-weight: 700;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <h1>Hockey Game Animation (PWHL + Olympics)</h1>
  <h2 id="subtitle">Animate shot and goal locations for PWHL games and Olympic women’s hockey games.</h2>

  <div class="controls">
    <label for="datasetSelect">Dataset:</label>
    <select id="datasetSelect">
      <option value="pwhl">PWHL</option>
      <option value="olympics_2022">Olympic Games (Women)</option>
    </select>

    <label for="showSelect">Show:</label>
    <select id="showSelect">
      <option value="all">Goals + Shots</option>
      <option value="goals">Goals only</option>
    </select>

    <label for="gameSelect">Game:</label>
    <select id="gameSelect"></select>

    <button id="loadBtn">Load game events</button>
    <button id="playBtn">▶ Play</button>
    <button id="pauseBtn">⏸ Pause</button>
    <button id="resetBtn">↺ Reset</button>

    <span id="status" class="status">No events loaded</span>
  </div>

  <div id="chart"></div>

  <div class="legend">
    <div class="legend-item"><span class="dot" style="background:#c41e3a;"></span> Home / Team A</div>
    <div class="legend-item"><span class="dot" style="background:#355c97;"></span> Away / Team B</div>
    <div class="legend-item">★ Goal</div>
    <div class="legend-item">● Shot</div>
    <div class="legend-item">⬤ Current event outline</div>
  </div>

  <div id="eventMeta" class="meta">No event loaded</div>

  <script>
    const width = 200;
    const height = 85;

    const chart = document.getElementById("chart");
    const datasetSelect = document.getElementById("datasetSelect");
    const showSelect = document.getElementById("showSelect");
    const gameSelect = document.getElementById("gameSelect");
    const statusEl = document.getElementById("status");
    const eventMeta = document.getElementById("eventMeta");

    const loadBtn = document.getElementById("loadBtn");
    const playBtn = document.getElementById("playBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");

    let svg;
    let schedule = [];
    let events = [];
    let filteredEvents = [];
    let currentIndex = -1;
    let timer = null;

    const HOME_COLOR = "#c41e3a";
    const AWAY_COLOR = "#355c97";
    const OUTLINE_COLOR = "#111";

    const DATASETS = {
      pwhl: {
        schedulePath: "./pwhl_schedule.json",
        gamesFolder: "./pwhl_games",
        title: "PWHL"
      },
      olympics_2022: {
        schedulePath: "./olympics_2022_schedule.json",
        gamesFolder: "./olympics_2022_games",
        title: "Olympic Games (Women)"
      }
    };

    function createSVG() {
      chart.innerHTML = "";
      svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      chart.appendChild(svg);
    }

    function el(name, attrs = {}) {
      const node = document.createElementNS("http://www.w3.org/2000/svg", name);
      for (const [key, value] of Object.entries(attrs)) {
        node.setAttribute(key, value);
      }
      return node;
    }

    function drawRink() {
      createSVG();

      svg.appendChild(el("rect", {
        x: 2, y: 2, width: 196, height: 81, rx: 10, ry: 10,
        fill: "#f8f8f8", stroke: "#7ea0cf", "stroke-width": 1
      }));

      svg.appendChild(el("line", {
        x1: 75, y1: 2, x2: 75, y2: 83,
        stroke: "#2c6db4", "stroke-width": 0.8
      }));

      svg.appendChild(el("line", {
        x1: 125, y1: 2, x2: 125, y2: 83,
        stroke: "#2c6db4", "stroke-width": 0.8
      }));

      svg.appendChild(el("line", {
        x1: 100, y1: 2, x2: 100, y2: 83,
        stroke: "#cf2f2f", "stroke-width": 0.8
      }));

      svg.appendChild(el("circle", {
        cx: 100, cy: 42.5, r: 9,
        fill: "none", stroke: "#cf2f2f", "stroke-width": 0.8
      }));

      svg.appendChild(el("rect", {
        x: 2, y: 34, width: 6, height: 17,
        fill: "none", stroke: "#cf2f2f", "stroke-width": 0.8
      }));

      svg.appendChild(el("rect", {
        x: 192, y: 34, width: 6, height: 17,
        fill: "none", stroke: "#cf2f2f", "stroke-width": 0.8
      }));
    }

    function currentDataset() {
      return DATASETS[datasetSelect.value];
    }

    function currentGame() {
      return schedule.find(g => String(g.game_id) === String(gameSelect.value));
    }

    function stopPlayback() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    function normalizeEvent(event, game) {
      const x = Number(event.x);
      const y = Number(event.y);
      const period = Number(event.period);
      const eventType = String(event.event_type || "").toLowerCase();
      const team = String(event.team || "");

      let color = AWAY_COLOR;

      if (team && game) {
        const home = String(game.home_team || "");
        const away = String(game.away_team || "");
        if (team === home) color = HOME_COLOR;
        else if (team === away) color = AWAY_COLOR;
      } else if (datasetSelect.value === "olympics_2022") {
        color = AWAY_COLOR;
      }

      let plotX = x;
      if (Number.isFinite(period) && period % 2 === 0) {
        plotX = 200 - x;
      }

      return {
        ...event,
        plotX,
        plotY: y,
        color,
        eventType
      };
    }

    function drawCircle(x, y, r, fill, isCurrent) {
      const circle = el("circle", {
        cx: x,
        cy: y,
        r: r,
        fill: fill,
        stroke: isCurrent ? OUTLINE_COLOR : "none",
        "stroke-width": isCurrent ? 1.1 : 0
      });
      svg.appendChild(circle);
    }

    function drawStar(x, y, r, fill, isCurrent) {
      let d = "";
      const spikes = 5;
      const outer = r;
      const inner = r * 0.45;
      let rot = Math.PI / 2 * 3;
      const step = Math.PI / spikes;

      d += `M ${x} ${y - outer} `;
      for (let i = 0; i < spikes; i++) {
        d += `L ${x + Math.cos(rot) * outer} ${y + Math.sin(rot) * outer} `;
        rot += step;
        d += `L ${x + Math.cos(rot) * inner} ${y + Math.sin(rot) * inner} `;
        rot += step;
      }
      d += "Z";

      const star = el("path", {
        d,
        fill,
        stroke: isCurrent ? OUTLINE_COLOR : "none",
        "stroke-width": isCurrent ? 1.1 : 0
      });
      svg.appendChild(star);
    }

    function sortEvents(arr) {
      return [...arr].sort((a, b) => {
        const pa = Number(a.period) || 0;
        const pb = Number(b.period) || 0;
        if (pa !== pb) return pa - pb;

        const [am = 0, as = 0] = String(a.clock || "0:00").split(":").map(Number);
        const [bm = 0, bs = 0] = String(b.clock || "0:00").split(":").map(Number);
        return am * 60 + as - (bm * 60 + bs);
      });
    }

    function filterEvents(allEvents) {
      if (showSelect.value === "goals") {
        return allEvents.filter(e => String(e.event_type).toLowerCase() === "goal");
      }
      return allEvents.filter(e => {
        const t = String(e.event_type).toLowerCase();
        return t === "goal" || t === "shot";
      });
    }

    function render(index) {
      drawRink();

      const game = currentGame();

      filteredEvents.forEach((rawEvent, i) => {
        if (i > index) return;

        const event = normalizeEvent(rawEvent, game);
        const isCurrent = i === index;

        if (!Number.isFinite(event.plotX) || !Number.isFinite(event.plotY)) return;

        if (event.eventType === "goal") {
          drawStar(event.plotX, event.plotY, 2.6, event.color, isCurrent);
        } else {
          drawCircle(event.plotX, event.plotY, 1.8, event.color, isCurrent);
        }
      });

      if (index >= 0 && filteredEvents[index]) {
        const e = filteredEvents[index];
        const teamText = e.team ? ` — ${e.team}` : "";
        eventMeta.innerHTML =
          `P${e.period} ${e.clock}${teamText} <span class="pill">${String(e.event_type).toUpperCase()}</span>`;
      } else {
        eventMeta.textContent = "No event loaded";
      }
    }

    function reset() {
      stopPlayback();
      currentIndex = -1;
      render(currentIndex);
      statusEl.textContent = filteredEvents.length ? "Ready" : "No events loaded";
    }

    function play() {
      if (!filteredEvents.length) return;

      stopPlayback();

      if (currentIndex >= filteredEvents.length - 1) {
        currentIndex = -1;
      }

      statusEl.textContent = "Playing...";

      timer = setInterval(() => {
        currentIndex += 1;
        if (currentIndex >= filteredEvents.length) {
          currentIndex = filteredEvents.length - 1;
          stopPlayback();
          statusEl.textContent = "Finished";
          render(currentIndex);
          return;
        }
        render(currentIndex);
      }, 650);
    }

    function pause() {
      stopPlayback();
      statusEl.textContent = "Paused";
    }

    async function loadSchedule() {
      stopPlayback();
      currentIndex = -1;
      events = [];
      filteredEvents = [];
      statusEl.textContent = "Loading schedule...";
      eventMeta.textContent = "No event loaded";

      const cfg = currentDataset();
      const res = await fetch(cfg.schedulePath);
      if (!res.ok) throw new Error(`Could not load ${cfg.schedulePath}`);

      schedule = await res.json();
      schedule = schedule.map(g => ({
        ...g,
        game_id: String(g.game_id)
      }));

      gameSelect.innerHTML = "";

      schedule.forEach(game => {
        const option = document.createElement("option");
        option.value = game.game_id;
        option.textContent = game.label || `${game.game_date} — ${game.away_team} @ ${game.home_team}`;
        gameSelect.appendChild(option);
      });

      statusEl.textContent = schedule.length ? "Schedule loaded" : "No games found";
      render(-1);
    }

    async function loadGame() {
      stopPlayback();
      currentIndex = -1;

      const cfg = currentDataset();
      const game = currentGame();
      if (!game) return;

      statusEl.textContent = "Loading game events...";

      const path = `${cfg.gamesFolder}/game_${game.game_id}.json`;
      const res = await fetch(path);

      if (!res.ok) {
        events = [];
        filteredEvents = [];
        render(-1);
        statusEl.textContent = `Could not load ${path}`;
        return;
      }

      events = await res.json();
      events = sortEvents(events);
      filteredEvents = filterEvents(events);

      render(-1);
      statusEl.textContent = filteredEvents.length
        ? `${filteredEvents.length} events loaded`
        : "No matching events";
    }

    datasetSelect.addEventListener("change", loadSchedule);

    showSelect.addEventListener("change", () => {
      filteredEvents = filterEvents(events);
      reset();
    });

    loadBtn.addEventListener("click", loadGame);
    playBtn.addEventListener("click", play);
    pauseBtn.addEventListener("click", pause);
    resetBtn.addEventListener("click", reset);

    drawRink();
    loadSchedule().catch(err => {
      console.error(err);
      statusEl.textContent = "Schedule load failed";
    });
  </script>
</body>
</html>
