<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Hockey</title>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="../pwhl_schedule.js?v=3"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #fafafa;
    }

    h1, h2 {
      text-align: center;
      margin: 8px 0;
    }

    .controls {
      text-align: center;
      margin-bottom: 16px;
    }

    .controls select,
    .controls button {
      font-size: 16px;
      padding: 8px 10px;
      margin: 4px;
    }

    #chart {
      max-width: 820px;
      margin: 0 auto;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      background: white;
      border: 2px solid #aaa;
      border-radius: 8px;
    }

    .legend {
      max-width: 820px;
      margin: 12px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      font-size: 16px;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .meta {
      max-width: 820px;
      margin: 14px auto 0;
      font-size: 18px;
      text-align: left;
    }

    .status {
      color: #2f5597;
      font-weight: 700;
      margin-left: 10px;
    }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e9eefb;
      color: #3459c9;
      font-size: 13px;
      font-weight: 700;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <h1>Visualizing Women's Hockey:</h1>
  <h2>Shots on Goal in PWHL and Olympic Games</h2>

  <div class="controls">
    <label for="datasetSelect">Dataset:</label>
    <select id="datasetSelect">
      <option value="pwhl">PWHL</option>
      <option value="olympics_2022">Olympic Games (Women)</option>
    </select>

    <label for="gameSelect">Game:</label>
    <select id="gameSelect"></select>

    <button id="loadBtn">Load game events</button>
    <button id="playBtn">▶ Play</button>
    <button id="pauseBtn">⏸ Pause</button>
    <button id="resetBtn">↺ Reset</button>

    <span id="status" class="status">No events loaded</span>
  </div>

  <div id="chart"></div>

  <div class="legend">
    <div class="legend-item"><span class="dot" style="background:#c41e3a;"></span> Home / Team A</div>
    <div class="legend-item"><span class="dot" style="background:#355c97;"></span> Away / Team B</div>
    <div class="legend-item">★ Goal</div>
    <div class="legend-item">● Shot</div>
    <div class="legend-item">Outline = current event</div>
  </div>

  <div id="eventMeta" class="meta">No event loaded</div>

  <script>
    const BDC_URL = "https://raw.githubusercontent.com/the-bucketless/bdc/main/data/pxp_womens_oly_2022_v2.csv";

    const width = 200;
    const height = 85;

    const chart = document.getElementById("chart");
    const datasetSelect = document.getElementById("datasetSelect");
    const gameSelect = document.getElementById("gameSelect");
    const statusEl = document.getElementById("status");
    const eventMeta = document.getElementById("eventMeta");

    const loadBtn = document.getElementById("loadBtn");
    const playBtn = document.getElementById("playBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resetBtn = document.getElementById("resetBtn");

    let svg;
    let schedule = [];
    let events = [];
    let currentIndex = -1;
    let timer = null;
    let activeGameScript = null;
    let bdcRows = null;

    const HOME_COLOR = "#c41e3a";
    const AWAY_COLOR = "#355c97";
    const HOME_SHOT_FILL = "rgba(196, 30, 58, 0.22)";
    const AWAY_SHOT_FILL = "rgba(53, 92, 151, 0.22)";
    const OUTLINE_COLOR = "#111";

    function createSVG() {
      chart.innerHTML = "";
      svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      chart.appendChild(svg);
    }

    function el(name, attrs = {}) {
      const node = document.createElementNS("http://www.w3.org/2000/svg", name);
      for (const [key, value] of Object.entries(attrs)) {
        node.setAttribute(key, value);
      }
      return node;
    }

    function drawRink() {
      createSVG();

      svg.appendChild(el("rect", {
        x: 2, y: 2, width: 196, height: 81, rx: 10, ry: 10,
        fill: "#f8f8f8", stroke: "#7ea0cf", "stroke-width": 1
      }));

      svg.appendChild(el("line", {
        x1: 75, y1: 2, x2: 75, y2: 83,
        stroke: "#2c6db4", "stroke-width": 0.8
      }));

      svg.appendChild(el("line", {
        x1: 125, y1: 2, x2: 125, y2: 83,
        stroke: "#2c6db4", "stroke-width": 0.8
      }));

      svg.appendChild(el("line", {
        x1: 100, y1: 2, x2: 100, y2: 83,
        stroke: "#cf2f2f", "stroke-width": 0.8
      }));

      svg.appendChild(el("circle", {
        cx: 100, cy: 42.5, r: 9,
        fill: "none", stroke: "#cf2f2f", "stroke-width": 0.8
      }));

      svg.appendChild(el("rect", {
        x: 2, y: 34, width: 6, height: 17,
        fill: "none", stroke: "#cf2f2f", "stroke-width": 0.8
      }));

      svg.appendChild(el("rect", {
        x: 192, y: 34, width: 6, height: 17,
        fill: "none", stroke: "#cf2f2f", "stroke-width": 0.8
      }));
    }

    function stopPlayback() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    function currentGame() {
      return schedule.find(g => String(g.game_id) === String(gameSelect.value));
    }

    function removeActiveGameScript() {
      if (activeGameScript && activeGameScript.parentNode) {
        activeGameScript.parentNode.removeChild(activeGameScript);
      }
      activeGameScript = null;
    }

    function secondsToClock(seconds) {
      const s = Math.max(0, Number(seconds) || 0);
      const mins = Math.floor(s / 60);
      const secs = Math.floor(s % 60);
      return `${mins}:${String(secs).padStart(2, "0")}`;
    }

    function buildOlympicsGameId(row) {
      const date = String(row.game_date || "").slice(0, 10);
      const t1 = String(row.team_name || "");
      const t2 = String(row.opp_team_name || "");
      const teams = [t1, t2].sort();
      return `${date}__${teams[0]}__${teams[1]}`;
    }

    function buildOlympicsSchedule(rows) {
      const seen = new Map();

      rows.forEach(row => {
        const gameId = buildOlympicsGameId(row);
        if (seen.has(gameId)) return;

        const date = String(row.game_date || "").slice(0, 10);
        const homeTeam = String(row.team_name || "");
        const awayTeam = String(row.opp_team_name || "");

        seen.set(gameId, {
          game_id: gameId,
          game_date: date,
          home_team: homeTeam,
          away_team: awayTeam,
          label: `${date} — ${awayTeam} @ ${homeTeam}`
        });
      });

      return Array.from(seen.values()).sort((a, b) => {
        if (a.game_date !== b.game_date) return a.game_date.localeCompare(b.game_date);
        return a.game_id.localeCompare(b.game_id);
      });
    }

    function buildOlympicsEvents(gameId) {
  const game = schedule.find(g => String(g.game_id) === String(gameId));
  const gameRows = bdcRows.filter(row => buildOlympicsGameId(row) === gameId);

  return gameRows.map(row => {
    const rawEvent = String(row.event || "").toLowerCase();

    let eventType = null;
    if (rawEvent.includes("goal")) eventType = "goal";
    else if (rawEvent.includes("shot")) eventType = "shot";

    const x = Number(row.x_coord);
    const y = Number(row.y_coord);

    if (!eventType || !Number.isFinite(x) || !Number.isFinite(y)) return null;

    const team = String(row.team_name || "").trim();
    const home = String(game?.home_team || "").trim();
    const away = String(game?.away_team || "").trim();

    let side = "away";
    if (team === home) side = "home";
    else if (team === away) side = "away";

    return {
      game_id: gameId,
      team,
      side,
      period: Number(row.period),
      clock: secondsToClock(row.clock_seconds),
      event_type: eventType,
      x,
      y
    };
  }).filter(Boolean);
}

    function sortEvents(arr) {
      return [...arr].sort((a, b) => {
        const pa = Number(a.period) || 0;
        const pb = Number(b.period) || 0;
        if (pa !== pb) return pa - pb;

        const [am = 0, as = 0] = String(a.clock || "0:00").split(":").map(Number);
        const [bm = 0, bs = 0] = String(b.clock || "0:00").split(":").map(Number);
        return am * 60 + as - (bm * 60 + bs);
      });
    }

    function normalizeEvent(event, game, dataset) {
  const rawX = Number(event.x);
  const rawY = Number(event.y);
  const period = Number(event.period);
  const eventType = String(event.event_type || "").toLowerCase();

  let color = AWAY_COLOR;
  let shotFill = AWAY_SHOT_FILL;

  if (dataset === "olympics_2022") {
    if (event.side === "home") {
      color = HOME_COLOR;
      shotFill = HOME_SHOT_FILL;
    } else {
      color = AWAY_COLOR;
      shotFill = AWAY_SHOT_FILL;
    }

    let plotX = rawX;
    let plotY = rawY;

    // mirror one team so both teams appear on opposite halves
    if (event.side === "home") {
      plotX = 200 - rawX;
    }

    return {
      ...event,
      plotX,
      plotY,
      color,
      shotFill,
      eventType
    };
  }

  const team = String(event.team || "").trim();
  const home = String(game.home_team || "").trim();
  const away = String(game.away_team || "").trim();

  if (team.includes(home)) {
    color = HOME_COLOR;
    shotFill = HOME_SHOT_FILL;
  } else if (team.includes(away)) {
    color = AWAY_COLOR;
    shotFill = AWAY_SHOT_FILL;
  }

  if (!team) {
    color = "#888";
    shotFill = "rgba(120,120,120,0.2)";
  }

  let plotX = rawX;
  if (Number.isFinite(period) && period % 2 === 0) {
    plotX = 200 - rawX;
  }

  return {
    ...event,
    plotX,
    plotY: rawY,
    color,
    shotFill,
    eventType
  };
}

    function drawCircle(x, y, r, fill, isCurrent) {
      const circle = el("circle", {
        cx: x,
        cy: y,
        r,
        fill,
        stroke: isCurrent ? OUTLINE_COLOR : "none",
        "stroke-width": isCurrent ? 0.45 : 0
      });
      svg.appendChild(circle);
    }

    function drawStar(x, y, r, fill, isCurrent) {
      let d = "";
      const spikes = 5;
      const outer = r;
      const inner = r * 0.45;
      let rot = Math.PI / 2 * 3;
      const step = Math.PI / spikes;

      d += `M ${x} ${y - outer} `;
      for (let i = 0; i < spikes; i++) {
        d += `L ${x + Math.cos(rot) * outer} ${y + Math.sin(rot) * outer} `;
        rot += step;
        d += `L ${x + Math.cos(rot) * inner} ${y + Math.sin(rot) * inner} `;
        rot += step;
      }
      d += "Z";

      const star = el("path", {
        d,
        fill,
        stroke: isCurrent ? OUTLINE_COLOR : "none",
        "stroke-width": isCurrent ? 0.45 : 0
      });
      svg.appendChild(star);
    }

    function render(index) {
      if (index === 0) console.log(events[0]);
      drawRink();

      const game = currentGame();
      const dataset = datasetSelect.value;

      events.forEach((rawEvent, i) => {
        if (i > index) return;

        const event = normalizeEvent(rawEvent, game, dataset);
        const isCurrent = i === index;

        if (!Number.isFinite(event.plotX) || !Number.isFinite(event.plotY)) return;

        if (event.eventType === "goal") {
          drawStar(event.plotX, event.plotY, 2.5, event.color, isCurrent);
        } else {
          drawCircle(event.plotX, event.plotY, 1.0, event.shotFill, isCurrent);
        }
      });

      if (index >= 0 && events[index]) {
        const e = events[index];
        const teamText = e.team ? ` — ${e.team}` : "";
        eventMeta.innerHTML =
          `P${e.period} ${e.clock}${teamText} <span class="pill">${String(e.event_type).toUpperCase()}</span>`;
      } else {
        eventMeta.textContent = "No event loaded";
      }
    }

    function reset() {
      stopPlayback();
      currentIndex = -1;
      render(currentIndex);
      statusEl.textContent = events.length ? "Ready" : "No events loaded";
    }

    function play() {
      if (!events.length) return;

      stopPlayback();

      if (currentIndex >= events.length - 1) {
        currentIndex = -1;
      }

      statusEl.textContent = "Playing...";

      timer = setInterval(() => {
        currentIndex += 1;
        if (currentIndex >= events.length) {
          currentIndex = events.length - 1;
          stopPlayback();
          statusEl.textContent = "Finished";
          render(currentIndex);
          return;
        }
        render(currentIndex);
      }, 650);
    }

    function pause() {
      stopPlayback();
      statusEl.textContent = "Paused";
    }

    function fillGameDropdown() {
      gameSelect.innerHTML = "";

      schedule.forEach(game => {
        const option = document.createElement("option");
        option.value = String(game.game_id);
        option.textContent = game.label || `${game.game_date} — ${game.away_team} @ ${game.home_team}`;
        gameSelect.appendChild(option);
      });

      render(-1);
    }

    async function loadSchedule() {
      stopPlayback();
      currentIndex = -1;
      events = [];
      eventMeta.textContent = "No event loaded";
      removeActiveGameScript();

      if (datasetSelect.value === "pwhl") {
        schedule = (window.pwhl_schedule || []).map(g => ({
          ...g,
          game_id: String(g.game_id)
        }));
        fillGameDropdown();
        statusEl.textContent = schedule.length ? "Schedule loaded" : "No games found";
        return;
      }

      statusEl.textContent = "Loading Olympics data...";
      try {
        if (!bdcRows) {
          bdcRows = await d3.csv(BDC_URL, d => ({
            game_date: d.game_date,
            team_name: d.team_name,
            opp_team_name: d.opp_team_name,
            period: d.period,
            clock_seconds: +d.clock_seconds,
            event: d.event,
            x_coord: +d.x_coord,
            y_coord: +d.y_coord
          }));
        }

        schedule = buildOlympicsSchedule(bdcRows);
        fillGameDropdown();
        statusEl.textContent = schedule.length ? "Schedule loaded" : "No games found";
      } catch (err) {
        console.error(err);
        schedule = [];
        fillGameDropdown();
        statusEl.textContent = "Olympics load failed";
      }
    }

    function loadPwhlGame(gameId) {
      return new Promise((resolve, reject) => {
        removeActiveGameScript();

        const varName = `pwhl_game_${gameId}`;
        delete window[varName];

        const script = document.createElement("script");
        script.src = `../pwhl_games/game_${gameId}.js?v=${Date.now()}`;

        script.onload = () => {
          const loaded = window[varName];
          if (!loaded) {
            reject(new Error(`Could not find ${varName}`));
            return;
          }
          resolve(loaded);
        };

        script.onerror = () => reject(new Error("Could not load PWHL game file"));

        activeGameScript = script;
        document.head.appendChild(script);
      });
    }

    async function loadGame() {
      stopPlayback();
      currentIndex = -1;

      const game = currentGame();
      if (!game) return;

      statusEl.textContent = "Loading game events...";

      try {
        if (datasetSelect.value === "pwhl") {
          events = await loadPwhlGame(game.game_id);
        } else {
          events = buildOlympicsEvents(game.game_id);
        }

        events = sortEvents(events);
        render(-1);
        statusEl.textContent = events.length
          ? `${events.length} events loaded`
          : "No matching events";
      } catch (err) {
        console.error(err);
        events = [];
        render(-1);
        statusEl.textContent = "Could not load game events";
      }
    }

    datasetSelect.addEventListener("change", loadSchedule);
    loadBtn.addEventListener("click", loadGame);
    playBtn.addEventListener("click", play);
    pauseBtn.addEventListener("click", pause);
    resetBtn.addEventListener("click", reset);

    drawRink();
    loadSchedule();
  </script>
</body>
</html>
